<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Test App</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,sans-serif;background:#f5f5f7;color:#1d1d1f}.card{width:min(90%,420px);padding:28px;background:#fff;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.08)}input,button{width:100%;padding:12px 14px;border-radius:10px;font-size:16px}input{border:1px solid #c7c7cc}button{margin-top:14px;border:0;cursor:pointer}#status{min-height:1.5em;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <h1>AI Test App</h1>
    <form id="unlock">
      <label for="key">アクセスキー</label>
      <input id="key" type="password" required />
      <button type="submit">開く</button>
    </form>
    <p id="status" aria-live="polite"></p>
  </main>
  <script>
    const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    document.querySelector('#unlock').addEventListener('submit',async e=>{
      e.preventDefault();
      const status=document.querySelector('#status');
      status.textContent='確認中…';
      try{
        const p=await (await fetch('app.enc',{cache:'no-store'})).json();
        const raw=new TextEncoder().encode(document.querySelector('#key').value);
        const km=await crypto.subtle.importKey('raw',raw,'PBKDF2',false,['deriveKey']);
        const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
        const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.iv)},k,b64(p.ciphertext));
        document.open();document.write(new TextDecoder().decode(clear));document.close();
      }catch(_){status.textContent='アクセスキーが違うか、データを読み込めませんでした。'}
    });
  </script>
</body>
</html>
